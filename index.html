<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Git 大作战 · GitStudy 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #010409; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 26px 16px 18px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #e6edf3;
    letter-spacing: 1px;
  }
  header p {
    margin-top: 6px;
    font-size: 14px;
    color: #8b949e;
  }

  main {
    flex: 1;
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
    padding: 8px 16px 20px;
    flex-wrap: wrap;
  }

  /* ===== 游戏舞台 ===== */
  .stage {
    position: relative;
    width: 480px;
    max-width: 100%;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #30363d;
    border-radius: 12px;
    background: #0d1117;
    touch-action: none;
  }

  /* ===== 遮罩层 ===== */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(1, 4, 9, 0.88);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    transition: opacity .2s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #ov-title { font-size: 26px; color: #e6edf3; margin-bottom: 12px; }
  #ov-text { font-size: 14px; color: #8b949e; line-height: 1.9; margin-bottom: 22px; }
  #ov-text b { color: #58a6ff; }
  #ov-btn {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 34px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  #ov-btn:hover { background: #2ea043; }

  /* ===== Toast ===== */
  #toast {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(35, 134, 54, 0.95);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 侧栏 ===== */
  .side {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stats { display: flex; gap: 12px; }
  .stat {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat .num {
    display: block;
    font-size: 30px;
    font-weight: 700;
    color: #58a6ff;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .stat .label { font-size: 12px; color: #8b949e; }

  .logbox {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    overflow: hidden;
  }
  .logbox-title {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: #8b949e;
    padding: 10px 14px;
    border-bottom: 1px solid #30363d;
    background: rgba(110, 118, 129, 0.06);
  }
  #log { padding: 8px 14px 12px; min-height: 150px; }
  .log-row {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    line-height: 1.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: logIn .25s ease;
  }
  .log-row .hash { color: #d29922; margin-right: 8px; }
  .log-row .msg { color: #8b949e; }
  .log-empty { font-size: 12px; color: #484f58; padding: 8px 0; }
  @keyframes logIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .help {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #8b949e;
    line-height: 2;
  }
  .help b { color: #c9d1d9; }

  /* ===== 方向键（触屏设备显示） ===== */
  .dpad { display: none; }
  @media (pointer: coarse) {
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 46px);
      gap: 6px;
      justify-content: center;
    }
  }
  .dpad button {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #58a6ff;
    font-size: 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad button:active { background: #30363d; }
  .dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  .dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .dpad button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .dpad button:nth-child(4) { grid-column: 3; grid-row: 2; }

  footer {
    text-align: center;
    padding: 14px;
    font-size: 12px;
    color: #484f58;
    border-top: 1px solid #21262d;
  }

  @media (max-width: 780px) {
    .side { width: 480px; max-width: 100%; }
    .stats { order: -1; }
  }
</style>
</head>
<body>

<header>
  <h1>🐍 Git 大作战</h1>
  <p>吃掉 commit，壮大你的提交历史 —— 小心别撞墙</p>
</header>

<main>
  <div class="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <button id="ov-btn" type="button"></button>
    </div>
    <div id="toast"></div>
  </div>

  <aside class="side">
    <div class="stats">
      <div class="stat"><span class="num" id="score">0</span><span class="label">commits</span></div>
      <div class="stat"><span class="num" id="best">0</span><span class="label">最高纪录</span></div>
    </div>

    <div class="logbox">
      <div class="logbox-title">$ git log --oneline</div>
      <div id="log"><div class="log-empty">还没有提交，去吃一个 commit 试试 →</div></div>
    </div>

    <div class="help">
      <div>🕹️ <b>方向键 / WASD</b> 控制移动</div>
      <div>␣ <b>空格键</b> 开始 / 暂停</div>
      <div>📱 手机可滑动屏幕或用下方按键</div>
      <div>🚀 每凑够 <b>5 个 commit</b> 自动 push，速度变快</div>
    </div>

    <div class="dpad">
      <button type="button" data-d="up">▲</button>
      <button type="button" data-d="left">◀</button>
      <button type="button" data-d="down">▼</button>
      <button type="button" data-d="right">▶</button>
    </div>
  </aside>
</main>

<footer>GitStudy 教学仓库配套小游戏 · 在游戏里体验 commit 与 push 的快乐</footer>

<script>
(function () {
  "use strict";

  /* ===== 基础配置 ===== */
  var COLS = 20, ROWS = 20, CELL = 24;
  var W = COLS * CELL, H = ROWS * CELL;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  canvas.width = W;
  canvas.height = H;

  var MSGS = [
    "feat: 新增一个功能", "fix: 修复一个 bug", "docs: 更新文档",
    "refactor: 重构代码", "style: 微调样式", "test: 补充测试",
    "chore: 杂项处理", "perf: 性能优化"
  ];

  var elScore = document.getElementById("score");
  var elBest = document.getElementById("best");
  var elLog = document.getElementById("log");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ov-title");
  var ovText = document.getElementById("ov-text");
  var ovBtn = document.getElementById("ov-btn");
  var toast = document.getElementById("toast");

  var snake, dir, nextDir, food, score, best, speed, state, last;

  best = parseInt(localStorage.getItem("gitsnake_best") || "0", 10) || 0;
  elBest.textContent = best;

  /* ===== 初始化 ===== */
  function init() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 170;
    elScore.textContent = "0";
    elLog.innerHTML = '<div class="log-empty">还没有提交，去吃一个 commit 试试 →</div>';
    placeFood();
    state = "ready";
    showOverlay(
      "Git 大作战",
      "方向键 / WASD 控制移动<br>空格键 开始或暂停<br>每 <b>5 个 commit</b> 会自动 push 🚀",
      "开始游戏"
    );
    draw();
  }

  function start() {
    if (state === "over") init();
    state = "playing";
    last = performance.now();
    hideOverlay();
  }

  function pause() {
    if (state !== "playing") return;
    state = "paused";
    showOverlay("已暂停", "喘口气，随时继续", "继续");
  }

  function toggle() {
    if (state === "playing") pause(); else start();
  }

  function gameOver() {
    state = "over";
    if (score > best) {
      best = score;
      localStorage.setItem("gitsnake_best", String(best));
    }
    elBest.textContent = best;
    showOverlay(
      "游戏结束",
      "本次共提交 <b>" + score + "</b> 个 commit<br>历史最高：" + best,
      "再来一局"
    );
  }

  /* ===== 核心逻辑 ===== */
  function placeFood() {
    var empty = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var onSnake = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { onSnake = true; break; }
        }
        if (!onSnake) empty.push({ x: x, y: y });
      }
    }
    food = empty.length ? empty[Math.floor(Math.random() * empty.length)] : { x: 0, y: 0 };
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    var hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      elScore.textContent = score;
      pushLog();
      if (score % 5 === 0) {
        showToast("🚀 push 到远程仓库成功！");
        speed = Math.max(70, speed - 8);
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function pushLog() {
    var hash = Math.random().toString(16).slice(2, 9);
    var msg = MSGS[Math.floor(Math.random() * MSGS.length)];
    var empty = elLog.querySelector(".log-empty");
    if (empty) empty.remove();
    var row = document.createElement("div");
    row.className = "log-row";
    var h = document.createElement("span");
    h.className = "hash";
    h.textContent = hash;
    var m = document.createElement("span");
    m.className = "msg";
    m.textContent = msg;
    row.appendChild(h);
    row.appendChild(m);
    elLog.insertBefore(row, elLog.firstChild);
    while (elLog.children.length > 8) elLog.removeChild(elLog.lastChild);
  }

  /* ===== 绘制 ===== */
  function mix(a, b, k) {
    var pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    var pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    return "rgb(" +
      Math.round(pa[0] + (pb[0] - pa[0]) * k) + "," +
      Math.round(pa[1] + (pb[1] - pa[1]) * k) + "," +
      Math.round(pa[2] + (pb[2] - pa[2]) * k) + ")";
  }

  function draw() {
    var t = performance.now();

    // 背景 + 网格
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(139,148,158,0.07)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 1; gx < COLS; gx++) { ctx.moveTo(gx * CELL + 0.5, 0); ctx.lineTo(gx * CELL + 0.5, H); }
    for (var gy = 1; gy < ROWS; gy++) { ctx.moveTo(0, gy * CELL + 0.5); ctx.lineTo(W, gy * CELL + 0.5); }
    ctx.stroke();

    // 食物：commit 节点（带脉冲光环）
    var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    var pulse = Math.sin(t / 220) * 1.5;
    ctx.save();
    ctx.shadowColor = "rgba(63,185,80,0.8)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#3fb950";
    ctx.beginPath(); ctx.arc(fx, fy, 7 + pulse * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(63,185,80,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fx, fy, 11 + pulse, 0, Math.PI * 2); ctx.stroke();

    // 蛇身：像 git 历史链一样的连线
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(47,129,247,0.35)";
    ctx.lineWidth = CELL - 8;
    ctx.beginPath();
    for (var i = 0; i < snake.length; i++) {
      var px = snake[i].x * CELL + CELL / 2;
      var py = snake[i].y * CELL + CELL / 2;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // 蛇身节点
    for (var j = snake.length - 1; j >= 0; j--) {
      var qx = snake[j].x * CELL + CELL / 2;
      var qy = snake[j].y * CELL + CELL / 2;
      var k = snake.length > 1 ? j / (snake.length - 1) : 0;
      ctx.fillStyle = j === 0 ? "#79c0ff" : mix("#58a6ff", "#1f6feb", k);
      ctx.beginPath();
      ctx.arc(qx, qy, j === 0 ? (CELL - 8) / 2 + 2 : (CELL - 10) / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇头眼睛
    var h = snake[0];
    var hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
    var ex = dir.x, ey = dir.y;
    var nx = -ey, ny = ex;
    ctx.fillStyle = "#0d1117";
    [1, -1].forEach(function (s) {
      ctx.beginPath();
      ctx.arc(hx + ex * 3 + nx * 4 * s, hy + ey * 3 + ny * 4 * s, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /* ===== 主循环 ===== */
  function loop(t) {
    requestAnimationFrame(loop);
    if (state === "playing") {
      if (t - last >= speed) { last = t; tick(); }
    }
    draw();
  }

  /* ===== 界面辅助 ===== */
  function showOverlay(title, html, btnText) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    ovBtn.textContent = btnText;
    overlay.classList.remove("hidden");
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }

  /* ===== 输入 ===== */
  var KEYMAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };

  function applyDir(d) {
    if (d.x === -dir.x && d.y === -dir.y) return; // 禁止 180° 掉头
    if (d.x === dir.x && d.y === dir.y) return;
    nextDir = d;
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar" || k === "Enter") {
      e.preventDefault();
      toggle();
      return;
    }
    var d = KEYMAP[k];
    if (d) {
      e.preventDefault();
      if (state !== "playing") { start(); applyDir(d); }
      else applyDir(d);
    }
  });

  ovBtn.addEventListener("click", toggle);
  canvas.addEventListener("click", function () { if (state !== "playing") start(); });

  // 触屏滑动
  var tsx = 0, tsy = 0;
  canvas.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    tsx = t.clientX; tsy = t.clientY;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      if (state !== "playing") start();
    } else {
      var d = Math.abs(dx) > Math.abs(dy)
        ? { x: dx > 0 ? 1 : -1, y: 0 }
        : { x: 0, y: dy > 0 ? 1 : -1 };
      if (state !== "playing") start();
      applyDir(d);
    }
    e.preventDefault();
  }, { passive: false });

  // 方向键按钮
  var DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  Array.prototype.forEach.call(document.querySelectorAll(".dpad button"), function (btn) {
    btn.addEventListener("click", function () {
      var d = DIRS[btn.getAttribute("data-d")];
      if (state !== "playing") start();
      applyDir(d);
    });
  });

  /* ===== 启动 ===== */
  init();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
