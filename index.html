<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>怪兽交响团 · 西部舞台 v2.0.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0710; }

  .stage { position: fixed; inset: 0; overflow: hidden; }
  .scene { width: 100%; height: 100%; display: block; }

  /* 暗角，让舞台中心更聚焦 */
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 62%, transparent 45%, rgba(6,3,10,.55) 100%);
  }

  /* 浮尘 */
  .dust { position: absolute; inset: 0; pointer-events: none; }
  .dust i {
    position: absolute; display: block; border-radius: 50%;
    background: rgba(255, 196, 128, .5);
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    15%  { opacity: .8; }
    85%  { opacity: .5; }
    100% { transform: translate3d(60px, -180px, 0); opacity: 0; }
  }

  /* 风滚草 */
  .tumbleweed {
    position: absolute; bottom: 6.5vh; left: -14vw;
    width: 74px; height: 74px;
    animation: roll 22s linear infinite;
    opacity: .55;
    pointer-events: none;
  }
  @keyframes roll {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(130vw, 0, 0) rotate(1080deg); }
  }

  /* 版本角标 */
  .tag {
    position: absolute; left: 22px; bottom: 18px;
    font: 12px/1.5 "Cascadia Code", Consolas, monospace;
    letter-spacing: 1px;
    color: rgba(255, 214, 170, .42);
    pointer-events: none;
  }

  /* 灯焰呼吸 */
  .flame { animation: flicker 3.2s ease-in-out infinite; transform-origin: center; }
  .flame.b { animation-delay: -1.4s; }
  @keyframes flicker {
    0%, 100% { opacity: .85; transform: scale(1); }
    42%      { opacity: 1;   transform: scale(1.09); }
    70%      { opacity: .78; transform: scale(.96); }
  }
  .glow { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: .55; }
    50%      { opacity: .8; }
  }
  .star { animation: twinkle 4.5s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .75; }
    50%      { opacity: .25; }
  }

  /* 挂牌轻摆 */
  .hangs {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: swing 5s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.2deg); }
  }

  /* 秃鹫扇翅 */
  .vulture .wings {
    transform-box: fill-box;
    transform-origin: center;
    animation: flap 1.15s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: scaleY(1); }
    to   { transform: scaleY(.5); }
  }

  /* ===== 怪兽 ===== */
  .monster { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .monster .figure { transition: filter .35s ease, opacity .35s ease; }
  .monster.off .figure { filter: grayscale(1) brightness(.55); opacity: .55; }
  .monster.on .figure { filter: drop-shadow(0 0 22px rgba(255, 176, 92, .55)); }

  .monster .head {
    transform-box: fill-box;
    transform-origin: 50% 88%;
    transition: transform .1s cubic-bezier(.2, .9, .3, 1);
  }
  .monster.bob .head { transform: translateY(9px) scale(1.03, .95) rotate(1.5deg); }

  .monster .strum {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .08s ease-out;
  }
  .monster.bob .strum { transform: translateY(7px) rotate(-14deg); }

  /* 身体随节拍摇摆（--swayDur/--swayDelay 由 JS 按节拍网格实时对齐） */
  .monster.on .figure {
    transform-box: fill-box;
    transform-origin: 50% 92%;
  }
  .monster.on.jam .figure {
    animation: sway var(--swayDur, 1.63s) ease-in-out infinite;
    animation-delay: var(--swayDelay, 0s);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.4deg); }
    50%      { transform: rotate(2.4deg); }
  }

  /* 没有怪兽演奏时，进度条不可用 */
  #seek:disabled { opacity: .3; cursor: default; }

  /* ===== 播放条 ===== */
  .player {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    width: min(720px, 88%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(18, 11, 16, .72);
    border: 1px solid rgba(255, 190, 120, .18);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 26px rgba(0, 0, 0, .45);
  }
  .player button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 190, 120, .38);
    background: rgba(255, 170, 90, .12);
    color: #ffcf9a;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  .player button:hover { background: rgba(255, 170, 90, .24); }
  .player button:active { transform: scale(.94); }

  .player .time {
    font: 12px/1 "Cascadia Code", Consolas, monospace;
    color: rgba(255, 214, 170, .62);
    min-width: 38px;
    text-align: center;
    flex-shrink: 0;
  }

  #seek {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 200, 140, .18);
    outline: none;
    cursor: pointer;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ffc27a;
    border: 2px solid rgba(60, 30, 12, .8);
    box-shadow: 0 0 10px rgba(255, 170, 90, .6);
  }
  #seek::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #ffc27a; border: 2px solid rgba(60, 30, 12, .8);
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    font-size: 12.5px;
    letter-spacing: 2px;
    color: rgba(255, 214, 170, .5);
    pointer-events: none;
    transition: opacity .5s;
  }
  .hint.gone { opacity: 0; }
</style>
</head>

  <div class="player">
    <button id="playBtn" type="button" aria-label="播放">▶</button>
    <span class="time" id="curTime">0:00</span>
    <input id="seek" type="range" min="0" max="100" step="0.05" value="0" disabled aria-label="播放进度">
    <span class="time" id="durTime">–:––</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== 乐曲节拍网格（离线分析 guitar.mp3 / drums.mp3 得出）=====
     全曲速度 147.28 BPM（一拍 0.40739s），第一个重拍落在 0.316s。
     整首 6 分 31 秒相位无漂移，已用开头/中间/结尾三段交叉验证。
     同一首歌的新增怪兽（贝斯/鼓/主唱）共用这份网格。 */
  var BPM = 147.28;
  var BEAT = 60 / BPM;
  var FIRST_BEAT = 0.316;

  /* ===== 怪兽注册表 =====
     新增怪兽只需两步：
       1) SVG 里给它一个 data-monster="xxx" 的分组
       2) 在这里登记一条配置（音轨 + 隔几拍点一次头） */
  var MONSTERS = [
    { id: "guitar", src: "guitar.mp3", bobBeats: 2, volume: 0.9 }
  ];

  var playBtn = document.getElementById("playBtn");
  var seek    = document.getElementById("seek");
  var curTime = document.getElementById("curTime");
  var durTime = document.getElementById("durTime");
  var hint    = document.getElementById("hint");
  var HINT_TEXT = hint.textContent;

  var transport = "idle";   // idle(台上没人) | playing | paused
  var dragging  = false;    // 拖动进度条期间不回写滑块
  var duration  = 0;
  var syncTick  = 0;

  function fmt(s) {
    s = Math.max(0, s);
    var m = Math.floor(s / 60);
    var r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function active() {
    return MONSTERS.filter(function (m) { return m.on; });
  }

  MONSTERS.forEach(function (m) {
    m.el = document.querySelector('[data-monster="' + m.id + '"]');
    m.on = false;
    m.lastBob = -1;

    m.audio = new Audio(m.src);
    m.audio.preload = "metadata";
    m.audio.volume = m.volume;

    m.audio.addEventListener("loadedmetadata", function () {
      var d = m.audio.duration;
      if (d && isFinite(d) && d > duration) {
        duration = d;
        seek.max = String(d);
        durTime.textContent = fmt(d);
      }
    });
    m.audio.addEventListener("ended", endSong);
    m.audio.addEventListener("error", function () {
      hint.textContent = "音轨加载失败：找不到 " + m.src;
      hint.classList.remove("gone");
    });

    /* 点怪兽 = 让它上场/下场（下场即静音并归零它的音轨） */
    m.el.addEventListener("click", function () {
      if (!m.on) {
        setMonster(m, true);
        if (transport === "paused") startTransport();
      } else {
        setMonster(m, false);
      }
    });
  });

  /* ---------- 怪兽上下场 ---------- */
  function setMonster(m, on) {
    m.on = on;
    m.el.classList.toggle("on", on);
    m.el.classList.toggle("off", !on);

    if (on) {
      hint.classList.add("gone");
      /* 台上已有同伴在演时，新上场者从同一时刻加入，保持乐队同步 */
      var others = active().filter(function (x) { return x !== m; });
      if (others.length) m.audio.currentTime = others[0].audio.currentTime;
      if (transport === "playing") {
        m.el.classList.add("jam");
        syncSway(m, m.audio.currentTime);
        safePlay(m);
      }
    } else {
      m.el.classList.remove("jam", "bob");
      m.lastBob = -1;
      m.audio.pause();
      m.audio.currentTime = 0;
      if (!active().length) updateUI(0);
    }
    refreshControls();
  }

  /* ---------- 走带（全体在演音轨的总开关） ---------- */
  function startTransport() {
    var a = active();
    if (!a.length) return;
    transport = "playing";
    playBtn.textContent = "❚❚";
    a.forEach(function (m) {
      syncSway(m, m.audio.currentTime);
      m.el.classList.add("jam");
      safePlay(m);
    });
  }

  function pauseTransport() {
    transport = "paused";
    playBtn.textContent = "▶";
    active().forEach(function (m) {
      m.audio.pause();
      m.el.classList.remove("jam", "bob");
    });
  }

  function endSong() {
    pauseTransport();
    active().forEach(function (m) {
      m.audio.currentTime = 0;
      m.lastBob = -1;
    });
    updateUI(0);
  }

  function safePlay(m) {
    var p = m.audio.play();
    if (p && p.catch) p.catch(function () { pauseTransport(); });
  }

  /* ---------- 播放条状态（静音/播放控制的初始与切换态） ---------- */
  function refreshControls() {
    var a = active();
    if (!a.length) {
      transport = "idle";
      seek.disabled = true;
      playBtn.textContent = "▶";
      hint.textContent = HINT_TEXT;
      hint.classList.remove("gone");
    } else {
      seek.disabled = false;
      if (transport === "idle") transport = "paused";
      playBtn.textContent = (transport === "playing") ? "❚❚" : "▶";
    }
    durTime.textContent = duration ? fmt(duration) : "–:––";
  }

  /* ---------- 摇摆 / 点头：以节拍网格为准 ---------- */
  function syncSway(m, pos) {
    var period = BEAT * m.bobBeats * 2;   // 身体一个来回 = 两次点头
    var ph = pos > FIRST_BEAT ? (pos - FIRST_BEAT) % period : 0;
    m.el.style.setProperty("--swayDur", period.toFixed(4) + "s");
    m.el.style.setProperty("--swayDelay", (-ph).toFixed(4) + "s");
  }

  function bob(m) {
    m.el.classList.add("bob");
    setTimeout(function () { m.el.classList.remove("bob"); }, 110);
  }

  /* ---------- 进度条 ---------- */
  function updateUI(p) {
    seek.value = String(p);
    curTime.textContent = fmt(p);
  }

  function commitSeek() {
    var v = parseFloat(seek.value) || 0;
    if (duration && v > duration) v = duration;
    active().forEach(function (m) {
      m.audio.currentTime = v;
      m.lastBob = -1;                        // 让点头网格随进度重算
      if (transport === "playing") syncSway(m, v);
    });
    updateUI(v);
  }

  seek.addEventListener("pointerdown", function () { dragging = true; });
  window.addEventListener("pointerup", function () {
    if (dragging) { dragging = false; commitSeek(); }
  });
  window.addEventListener("pointercancel", function () {
    if (dragging) { dragging = false; commitSeek(); }
  });
  seek.addEventListener("input", function () {
    curTime.textContent = fmt(parseFloat(seek.value) || 0);
    if (!dragging) commitSeek();   // 键盘方向键：立即生效
  });

  playBtn.addEventListener("click", function () {
    if (transport === "playing") { pauseTransport(); return; }
    if (!active().length) setMonster(MONSTERS[0], true);   // 没人上场时默认请吉他手开演
    startTransport();
  });

  /* ---------- 主循环：进度、点头、乐队对表，全部读同一时钟 ---------- */
  function frame() {
    requestAnimationFrame(frame);
    if (transport !== "playing" || dragging) return;
    var a = active();
    if (!a.length) return;
    var pos = a[0].audio.currentTime;
    updateUI(pos);

    for (var i = 0; i < a.length; i++) {
      var m = a[i];
      if (pos < FIRST_BEAT) { m.lastBob = -1; continue; }
      var idx = Math.floor((pos - FIRST_BEAT) / (BEAT * m.bobBeats));
      if (idx !== m.lastBob) { m.lastBob = idx; bob(m); }
    }

    /* 多轨保险：约每 30s 对一次表，防音轨之间漂移 */
    if (++syncTick % 1800 === 0 && a.length > 1) {
      var lead = a[0].audio.currentTime;
      for (var j = 1; j < a.length; j++) {
        if (Math.abs(a[j].audio.currentTime - lead) > 0.05) a[j].audio.currentTime = lead;
      }
    }
  }

  refreshControls();
  requestAnimationFrame(frame);
})();
</script>
