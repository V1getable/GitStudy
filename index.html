<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>GitStudy-AngelBand · 西部舞台 v2.5.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0710; }

  .stage { position: fixed; inset: 0; overflow: hidden; }
  .scene { width: 100%; height: 100%; display: block; position: relative; z-index: 1; }

  /* 背景幕布：铺满整屏，撑满裁切，压在最底层。
     轻微虚焦 + 压暗，把它推到远处，矢量道具才站得住 */
  .backdrop {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 100%;
    z-index: 0;
    pointer-events: none;
    filter: saturate(1.04) brightness(.9) blur(1px);
    transform: scale(1.015);
  }

  /* 暗角，让舞台中心更聚焦 */
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 62%, transparent 45%, rgba(6,3,10,.55) 100%);
  }

  /* 浮尘 */
  .dust { position: absolute; inset: 0; pointer-events: none; }
  .dust i {
    position: absolute; display: block; border-radius: 50%;
    background: rgba(255, 196, 128, .5);
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    15%  { opacity: .8; }
    85%  { opacity: .5; }
    100% { transform: translate3d(60px, -180px, 0); opacity: 0; }
  }

  /* 风滚草 */
  .tumbleweed {
    position: absolute; bottom: 6.5vh; left: -14vw;
    width: 74px; height: 74px;
    animation: roll 22s linear infinite;
    opacity: .55;
    pointer-events: none;
  }
  @keyframes roll {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(130vw, 0, 0) rotate(1080deg); }
  }

  /* 版本角标 */
  .tag {
    position: absolute; left: 22px; bottom: 18px;
    font: 12px/1.5 "Cascadia Code", Consolas, monospace;
    letter-spacing: 1px;
    color: rgba(255, 214, 170, .42);
    pointer-events: none;
  }

  /* 灯焰呼吸 */
  .flame { animation: flicker 3.2s ease-in-out infinite; transform-origin: center; }
  .flame.b { animation-delay: -1.4s; }
  @keyframes flicker {
    0%, 100% { opacity: .85; transform: scale(1); }
    42%      { opacity: 1;   transform: scale(1.09); }
    70%      { opacity: .78; transform: scale(.96); }
  }
  .glow { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: .55; }
    50%      { opacity: .8; }
  }
  .star { animation: twinkle 4.5s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .75; }
    50%      { opacity: .25; }
  }

  /* 挂牌轻摆 */
  .hangs {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: swing 5s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.2deg); }
  }

  /* 秃鹫扇翅 */
  .vulture .wings {
    transform-box: fill-box;
    transform-origin: center;
    animation: flap 1.15s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: scaleY(1); }
    to   { transform: scaleY(.5); }
  }

  /* ===== 怪兽（Spine 渲染层） ===== */
  #angel, #phonor, #bass, #drummer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #angel .figure, #angel .bobber,
  #phonor .figure, #phonor .bobber,
  #bass .figure, #bass .bobber,
  #drummer .figure, #drummer .bobber { position: absolute; inset: 0; }
  #angel canvas, #phonor canvas, #bass canvas, #drummer canvas { display: block; width: 100%; height: 100%; }
  #angel .hit, #phonor .hit, #bass .hit, #drummer .hit {
    position: absolute; pointer-events: auto; cursor: pointer; z-index: 3;
  }

  .monster .figure { transition: filter .35s ease, opacity .35s ease; transform-origin: 50% 88%; }
  .monster.off .figure { filter: grayscale(1) brightness(.78); opacity: .72; }
  .monster.on .figure { filter: drop-shadow(0 0 22px rgba(255, 176, 92, .55)); }

  /* 律动交给 Spine 动画本身；不再叠加 CSS 位移/旋转，
     否则整层 canvas 一起动，看起来就是人物上下蹦 */
  .monster .bobber { transition: none; }

  /* 轨道视觉只有 4px，但可点击区域做成 22px —— 否则滑块根本抓不住 */
  #seek {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 60px;
    height: 22px;
    margin: 0;
    padding: 0;
    border: none;
    outline: none;
    cursor: pointer;
    touch-action: none;
    background: linear-gradient(rgba(255, 200, 140, .2), rgba(255, 200, 140, .2)) center / 100% 4px no-repeat;
  }
  #seek::-webkit-slider-runnable-track { height: 4px; background: transparent; border-radius: 2px; }
  #seek::-moz-range-track { height: 4px; background: transparent; border-radius: 2px; }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    margin-top: -6px;
    border-radius: 50%;
    background: #ffc27a;
    border: 2px solid rgba(60, 30, 12, .8);
    box-shadow: 0 0 10px rgba(255, 170, 90, .6);
  }
  #seek::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ffc27a;
    border: 2px solid rgba(60, 30, 12, .8);
    box-shadow: 0 0 10px rgba(255, 170, 90, .6);
  }
  .player {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    width: min(720px, 88%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(18, 11, 16, .72);
    border: 1px solid rgba(255, 190, 120, .18);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 26px rgba(0, 0, 0, .45);
    z-index: 5;
    pointer-events: auto;
    user-select: none;
  }
  .player button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 190, 120, .38);
    background: rgba(255, 170, 90, .12);
    color: #ffcf9a;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  .player button:hover { background: rgba(255, 170, 90, .24); }
  .player button:active { transform: scale(.94); }

  .player .time {
    font: 12px/1 "Cascadia Code", Consolas, monospace;
    color: rgba(255, 214, 170, .62);
    min-width: 38px;
    text-align: center;
    flex-shrink: 0;
  }

  #seek {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 200, 140, .18);
    outline: none;
    cursor: pointer;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ffc27a;
    border: 2px solid rgba(60, 30, 12, .8);
    box-shadow: 0 0 10px rgba(255, 170, 90, .6);
  }
  #seek::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #ffc27a; border: 2px solid rgba(60, 30, 12, .8);
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    font-size: 12.5px;
    letter-spacing: 2px;
    color: rgba(255, 214, 170, .5);
    pointer-events: none;
    transition: opacity .5s;
  }
  .hint.gone { opacity: 0; }

  /* ===== 全员开演按钮：不是圆形，改成胶囊 ===== */
  .player #allBtn {
    width: auto;
    height: 30px;
    padding: 0 15px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #ffd7a6;
    background: rgba(255, 170, 90, .09);
    border-color: rgba(255, 190, 120, .26);
  }
  .player #allBtn:hover { background: rgba(255, 170, 90, .2); }
  .player #allBtn.on {
    color: #fff0dc;
    background: rgba(255, 170, 90, .26);
    border-color: rgba(255, 190, 120, .5);
  }

  /* ===== 开场帷幕 =====
     两块丝绒幕布，按住往任意一边拖就分开；拖得够远松手自动开到底，
     点一下也能直接拉开。开完从 DOM 里摘掉，不再挡点击。 */
  .curtain {
    position: absolute; inset: 0; z-index: 30;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }
  .curtain.dragging { cursor: grabbing; }
  .curtain.gone { display: none; }

  .curtain .half {
    position: absolute; top: 0; bottom: 0;
    width: 51%;
    will-change: transform;
    background:
      linear-gradient(90deg,
        #150105 0%, #3d0409 5%, #6d0f1a 11%, #2f0307 17%,
        #5c0a13 24%, #861723 31%, #39030a 38%, #6a0d18 46%,
        #300409 54%, #781220 62%, #8b1824 70%, #41050c 78%,
        #250306 86%, #120104 100%);
    box-shadow:
      inset 0 0 120px rgba(0, 0, 0, .8),
      inset 0 -140px 120px -80px rgba(0, 0, 0, .75);
  }
  .curtain .half.left  { left: 0; }
  .curtain .half.right { right: 0; }
  /* 幕布下摆的金色滚边 */
  .curtain .half::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(180deg, rgba(226, 176, 96, .55), rgba(120, 74, 24, .35));
  }
  /* 两片幕布合拢时的接缝高光 */
  .curtain .half.left::before,
  .curtain .half.right::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, rgba(255, 190, 120, .18), transparent 70%);
  }
  .curtain .half.left::before  { right: 0; }
  .curtain .half.right::before { left: 0; }

  /* 顶部固定帷幔：一条横带 + 一排下垂的扇形 */
  .curtain .valance {
    position: absolute; left: -2%; right: -2%; top: 0; height: 122px;
    background:
      linear-gradient(180deg, rgba(226, 176, 96, .42), rgba(226, 176, 96, .42)) 0 55px / 100% 2px no-repeat,
      radial-gradient(circle at 50% 0, #4d0812 0 43px, rgba(77, 8, 18, 0) 44px) 0 57px / 86px 86px repeat-x,
      linear-gradient(180deg, #38050d, #4d0812) 0 0 / 100% 57px no-repeat;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .55);
    pointer-events: none;
  }

  .curtain .tip {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    color: rgba(255, 228, 196, .9);
    text-shadow: 0 2px 16px rgba(0, 0, 0, .95), 0 0 32px rgba(255, 170, 90, .25);
  }
  .curtain .tip b {
    display: block;
    font-size: 19px; font-weight: 500; letter-spacing: 12px;
    margin-bottom: 12px;
    animation: tipPulse 2.6s ease-in-out infinite;
  }
  .curtain .tip span {
    font-size: 12px; letter-spacing: 4px; color: rgba(255, 210, 165, .62);
  }
  @keyframes tipPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="stage">
  <!-- 背景幕布：手绘西部黄昏（AI 生成的画布），矢量道具压在它上面 -->
  <img class="backdrop" src="art/backdrop.png" alt="">
  <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#100a24"/>
        <stop offset="38%"  stop-color="#2c1430"/>
        <stop offset="68%"  stop-color="#6a2a34"/>
        <stop offset="88%"  stop-color="#c25b3a"/>
        <stop offset="100%" stop-color="#e8874a"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffd08a" stop-opacity=".55"/>
        <stop offset="45%"  stop-color="#ff9a4d" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#ff7a3c" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffe4b0"/>
        <stop offset="70%"  stop-color="#ffb45f"/>
        <stop offset="100%" stop-color="#f08a3e"/>
      </radialGradient>

      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#2a1420" stop-opacity="0"/>
        <stop offset="26%"  stop-color="#1d0f1c" stop-opacity=".8"/>
        <stop offset="62%"  stop-color="#120a14" stop-opacity=".96"/>
        <stop offset="100%" stop-color="#0b0610"/>
      </linearGradient>

      <!-- 压在画出来的背景幕布上的一层紫调，让绘画和矢量道具能接得上 -->
      <linearGradient id="skyTint" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0b0518" stop-opacity=".72"/>
        <stop offset="34%"  stop-color="#200d2c" stop-opacity=".46"/>
        <stop offset="62%"  stop-color="#43162c" stop-opacity=".24"/>
        <stop offset="84%"  stop-color="#8a3a2c" stop-opacity=".12"/>
        <stop offset="100%" stop-color="#d0713c" stop-opacity=".04"/>
      </linearGradient>

      <linearGradient id="deckTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#7a4c28"/>
        <stop offset="100%" stop-color="#5b371d"/>
      </linearGradient>

      <linearGradient id="deckFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#4a2c17"/>
        <stop offset="100%" stop-color="#2c190e"/>
      </linearGradient>

      <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffcf82" stop-opacity=".7"/>
        <stop offset="55%"  stop-color="#ff9b45" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#ff7a2e" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="mBody" cx="32%" cy="22%" r="82%">
        <stop offset="0%"   stop-color="#B4DE93"/>
        <stop offset="48%"  stop-color="#7FB967"/>
        <stop offset="100%" stop-color="#4C8546"/>
      </radialGradient>
    </defs>

    <!-- 天空：现在是"压在画布背景上的一层紫调"，用来统一色调、压暗远景 -->
    <rect x="0" y="0" width="1600" height="560" fill="url(#skyTint)"/>

    <!-- 星星 -->
    <g fill="#ffe6c4">
      <circle class="star" cx="140" cy="70"  r="1.6"/>
      <circle class="star" cx="230" cy="132" r="1.1" style="animation-delay:-1.2s"/>
      <circle class="star" cx="330" cy="58"  r="1.4" style="animation-delay:-2.1s"/>
      <circle class="star" cx="420" cy="170" r="1"   style="animation-delay:-3s"/>
      <circle class="star" cx="520" cy="96"  r="1.7" style="animation-delay:-.6s"/>
      <circle class="star" cx="610" cy="40"  r="1.2" style="animation-delay:-1.8s"/>
      <circle class="star" cx="700" cy="140" r="1"   style="animation-delay:-2.6s"/>
      <circle class="star" cx="800" cy="76"  r="1.5" style="animation-delay:-.3s"/>
      <circle class="star" cx="900" cy="150" r="1.1" style="animation-delay:-1.5s"/>
      <circle class="star" cx="1000" cy="60" r="1.6" style="animation-delay:-2.9s"/>
      <circle class="star" cx="1090" cy="128" r="1"  style="animation-delay:-.9s"/>
      <circle class="star" cx="1180" cy="52" r="1.3" style="animation-delay:-2.2s"/>
      <circle class="star" cx="1280" cy="150" r="1.2" style="animation-delay:-3.4s"/>
      <circle class="star" cx="1380" cy="86" r="1.6" style="animation-delay:-1.1s"/>
      <circle class="star" cx="1470" cy="140" r="1"  style="animation-delay:-2.7s"/>
      <circle class="star" cx="1540" cy="62" r="1.4" style="animation-delay:-.5s"/>
    </g>

    <!-- 盘旋的秃鹫 -->
    <g class="vulture" opacity=".62">
      <animateMotion dur="32s" repeatCount="indefinite" rotate="0"
        path="M1080,220 C1130,150 1300,150 1350,220 C1300,290 1130,290 1080,220 Z"/>
      <g class="wings">
        <path d="M0,0 C-7,-9 -17,-10 -23,-4 C-14,-3 -6,1 0,3 C6,1 14,-3 23,-4 C17,-10 7,-9 0,0 Z" fill="#140b12"/>
      </g>
    </g>

    <!-- 落日 / 远山 / 岩脊 都交给背景画布了，这里不再重复画 -->

    <!-- 地面：顶部淡出，让画布里的荒原透出来，越靠近舞台越暗 -->
    <rect x="0" y="540" width="1600" height="360" fill="url(#groundGrad)"/>
    <ellipse cx="800" cy="770" rx="700" ry="96" fill="#0a050c" opacity=".55"/>

    <!-- 酒馆门面 -->
    <g>
      <rect x="300" y="470" width="560" height="270" fill="#2b1a20"/>
      <rect x="300" y="470" width="560" height="270" fill="none" stroke="#160c12" stroke-width="2"/>
      <g stroke="#1d1116" stroke-width="1.2" opacity=".8">
        <path d="M340,470 L340,740"/>
        <path d="M380,470 L380,740"/>
        <path d="M420,470 L420,740"/>
        <path d="M460,470 L460,740"/>
        <path d="M500,470 L500,740"/>
        <path d="M540,470 L540,740"/>
        <path d="M620,470 L620,740"/>
        <path d="M660,470 L660,740"/>
        <path d="M700,470 L700,740"/>
        <path d="M740,470 L740,740"/>
        <path d="M780,470 L780,740"/>
        <path d="M820,470 L820,740"/>
      </g>
      <!-- 女儿墙 -->
      <rect x="520" y="440" width="120" height="32" fill="#2b1a20" stroke="#160c12" stroke-width="2"/>
      <path d="M520,452 L640,452" stroke="#3a2312" stroke-width="2"/>
      <!-- 招牌 -->
      <rect x="356" y="478" width="448" height="52" fill="#1b1014" stroke="#8a5a30" stroke-width="2"/>
      <text x="580" y="514" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="6" fill="#e8b878">SALOON</text>
      <!-- 二楼窗 -->
      <rect x="390" y="540" width="62" height="44" fill="#150c10" stroke="#3a2312" stroke-width="2"/>
      <rect x="708" y="540" width="62" height="44" fill="#f2a95c" opacity=".75" stroke="#3a2312" stroke-width="2"/>
      <path d="M421,540 L421,584" stroke="#3a2312" stroke-width="1.5"/>
      <path d="M739,540 L739,584" stroke="#3a2312" stroke-width="1.5"/>
      <!-- 门廊顶沿 -->
      <rect x="278" y="586" width="604" height="12" fill="#3a2312" stroke="#160c12" stroke-width="1.5"/>
      <path d="M278,586 L882,586" stroke="#6b4426" stroke-width="2"/>
      <!-- 门楣横木 -->
      <rect x="300" y="598" width="560" height="8" fill="#241419"/>
      <!-- 马蹄铁挂牌 -->
      <g transform="translate(872,492)">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#1d1008" stroke-width="2"/>
        <g class="hangs">
          <rect x="-3" y="16" width="60" height="52" rx="4" fill="#3a2312" stroke="#1d1008" stroke-width="2"/>
          <path d="M15,52 C15,38 39,38 39,52 L39,60 L31,60 L31,52 C31,45 23,45 23,52 L23,60 L15,60 Z"
                fill="none" stroke="#d9a86a" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="19" cy="63" r="1.4" fill="#d9a86a"/>
          <circle cx="35" cy="63" r="1.4" fill="#d9a86a"/>
        </g>
      </g>
    </g>

    <!-- 仙人掌：左 -->
    <g fill="#120a18">
      <path d="M92,700 L92,586 C92,578 104,578 104,586 L104,700 Z"/>
      <path d="M74,622 C68,622 66,614 72,612 C84,608 90,616 90,626 L90,646 C90,652 80,652 80,646 L80,628 C80,624 78,622 74,622 Z"/>
      <path d="M120,642 C126,642 128,634 122,632 C110,628 106,636 106,646 L106,660 C106,666 116,666 116,660 L116,648 C116,644 118,642 120,642 Z"/>
    </g>
    <!-- 仙人掌：右 -->
    <g fill="#120a18">
      <path d="M1496,706 L1496,600 C1496,592 1508,592 1508,600 L1508,706 Z"/>
      <path d="M1476,638 C1470,638 1468,630 1474,628 C1486,624 1494,632 1494,642 L1494,660 C1494,666 1484,666 1484,660 L1484,644 C1484,640 1482,638 1476,638 Z"/>
    </g>

    <!-- 木质舞台（加宽加高） -->
    <g>
      <!-- 台面 -->
      <path d="M310,600 L1290,600 L1364,725 L236,725 Z" fill="url(#deckTop)"/>
      <!-- 木纹 -->
      <g stroke="#3d2412" stroke-width="1.4" opacity=".55">
        <path d="M302,614 L1298,614"/>
        <path d="M288,640 L1312,640"/>
        <path d="M271,666 L1329,666"/>
        <path d="M255,692 L1345,692"/>

<script src="spine/lib/pixi-spine-3.8.js"></script>
<script src="spine/lib/angel-assets.js"></script>
<script src="spine/lib/phonor-assets.js"></script>
<script src="spine/lib/mostma-assets.js"></script>
<script src="spine/lib/girl-assets.js"></script>
<script>
(function () {
  "use strict";

  /* ===== 乐曲节拍网格（离线分析 guitar.mp3 / drums.mp3 得出）=====
     全曲速度 147.28 BPM（一拍 0.40739s），第一个重拍落在 0.316s。
     整首 6 分 31 秒相位无漂移，已用开头/中间/结尾三段交叉验证。
     同一首歌的新增怪兽（贝斯/鼓/主唱）共用这份网格。 */
  var BPM = 147.28;
  var BEAT = 60 / BPM;
  var FIRST_BEAT = 0.316;

  /* ===== 怪兽注册表 =====
     新增怪兽只需两步：
       1) SVG 里给它一个 data-monster="xxx" 的分组
       2) 在这里登记一条配置（音轨 + 隔几拍点一次头） */
  var MONSTERS = [
    { id: "singer", src: "singer.mp3", bobBeats: 2, volume: 0.95 },
    { id: "guitar", src: "guitar.mp3", bobBeats: 2, volume: 0.9 },
    { id: "bass",   src: "bass.mp3",   bobBeats: 2, volume: 0.95 },
    { id: "drummer", src: "drums.mp3", bobBeats: 1, volume: 0.95 }
  ];

  var playBtn = document.getElementById("playBtn");
  var seek    = document.getElementById("seek");
  var curTime = document.getElementById("curTime");
  var durTime = document.getElementById("durTime");
  var hint    = document.getElementById("hint");
  var HINT_TEXT = hint.textContent;

  var transport = "idle";   // idle(台上没人) | playing | paused
  var dragging  = false;    // 拖动进度条期间不回写滑块
  var duration  = 0;
  var syncTick  = 0;
  var pendingPos = 0;      // 台上没人时拖动进度条，先记下位置
  var seekGuardUntil = 0;  // 跳转完成后再留一点回写缓冲
  var seekPending = false;  // 跳转指令还没落到音频上

  function fmt(s) {
    s = Math.max(0, s);
    var m = Math.floor(s / 60);
    var r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function active() {
    return MONSTERS.filter(function (m) { return m.on; });
  }

  /* 供 Spine 拨弦循环读取：当前正在演奏的音轨时间 */
  window.__angelAudioTime = function () {
    var a = active();
    return a.length ? a[0].audio.currentTime : null;
  };

  /* 单文件发行版把四条音轨以 base64 内嵌在 window.EMBED_AUDIO 里，
     直接解成 Blob，不经过网络；普通版还是读同目录的 mp3 */
  function loadTrackBlob(src) {
    var emb = window.EMBED_AUDIO && window.EMBED_AUDIO[src];
    if (emb) {
      var raw = atob(emb), bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return Promise.resolve(new Blob([bytes], { type: "audio/mpeg" }));
    }
    return fetch(src).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    });
  }

  function waitMetadata(m) {
    return new Promise(function (resolve) {
      if (m.audio.readyState >= 1) return resolve();
      m.audio.addEventListener("loadedmetadata", resolve, { once: true });
      m.audio.addEventListener("error", resolve, { once: true });
    });
  }

  MONSTERS.forEach(function (m) {
    m.el = document.querySelector('[data-monster="' + m.id + '"]');
    m.on = false;
    m.lastBob = -1;

    m.audio = new Audio();
    m.audio.preload = "auto";
    m.audio.volume = m.volume;

    /* 预览服务器不支持 HTTP Range，直接给 URL 会导致 currentTime 跳不动。
       把整段音频读进内存做成 Blob URL，浏览器就能任意定位。 */
    m.ready = loadTrackBlob(m.src)
      .then(function (blob) {
        m.audio.src = URL.createObjectURL(blob);
        m.audio.load();
        return waitMetadata(m);
      })
      .catch(function () {
        /* file:// 直接双击打开时 fetch 会被拦，退回原始路径 */
        m.audio.src = m.src;
        m.audio.load();
        return waitMetadata(m);
      });

    m.audio.addEventListener("loadedmetadata", function () {
      var d = m.audio.duration;
      if (d && isFinite(d) && d > duration) {
        duration = d;
        seek.max = String(d);
        durTime.textContent = fmt(d);
      }
    });
    m.audio.addEventListener("ended", endSong);
    m.audio.addEventListener("error", function () {
      hint.textContent = "音轨加载失败：找不到 " + m.src;
      hint.classList.remove("gone");
    });

    /* 点怪兽 = 让它上场/下场（下场即静音并归零它的音轨） */
    m.el.addEventListener("click", function () {
      if (!m.on) {
        setMonster(m, true);
        if (transport === "paused") startTransport();
      } else {
        setMonster(m, false);
      }
    });
  });

  /* ---------- 怪兽上下场 ---------- */
  function setMonster(m, on) {
    m.on = on;
    m.el.classList.toggle("on", on);
    m.el.classList.toggle("off", !on);

    if (on) {
      hint.classList.add("gone");
      /* 台上已有同伴在演时，新上场者从同一时刻加入，保持乐队同步 */
      var others = active().filter(function (x) { return x !== m; });
      var want = others.length ? others[0].audio.currentTime : pendingPos;
      m.ready.then(function () {
        try { m.audio.currentTime = want; } catch (e) {}
        if (transport === "playing") syncSway(m, m.audio.currentTime);
      });
      if (transport === "playing") {
        m.el.classList.add("jam");
        safePlay(m, JOIN_FADE);       /* 从 0 抬起来，别在乐句中间硬插进来 */
      } else {
        cancelFade(m);
        m.audio.volume = m.volume;
      }
    } else {
      /* 下场也不硬切：先淡出去，淡完再暂停。
         停下的位置记到 pendingPos，下次上场（或按播放键）从这一刻接着演 */
      m.el.classList.remove("jam", "bob");
      m.lastBob = -1;
      var lastOne = !active().length;
      if (m.audio.paused) {
        cancelFade(m);
        m.audio.volume = m.volume;
      } else {
        fadeOut(m, lastOne ? function () {
          /* 只剩她一个：等淡完再记位置，停下的点正好是淡出结束的点 */
          pendingPos = m.audio.currentTime;
          updateUI(pendingPos);
        } : null);
      }
      if (lastOne && m.audio.paused) {
        pendingPos = m.audio.currentTime;
        updateUI(pendingPos);
      }
    }
    refreshControls();
  }

  /* ---------- 走带（全体在演音轨的总开关） ---------- */
  function startTransport() {
    var a = active();
    if (!a.length) return;
    transport = "playing";
    playBtn.textContent = "❚❚";
    a.forEach(function (m) {
      m.ready.then(function () {
        if (transport === "playing") syncSway(m, m.audio.currentTime);
      });
      m.el.classList.add("jam");
      safePlay(m, RESUME_FADE);
    });
  }

  function pauseTransport() {
    transport = "paused";
    playBtn.textContent = "▶";
    active().forEach(function (m) {
      m.el.classList.remove("jam", "bob");
      if (m.audio.paused) return;
      fadeOut(m);            /* 暂停也留一点尾巴，硬切会「啪」一下 */
    });
  }

  function endSong() {
    /* 自然放完了，声音已经没了，淡出没意义：直接归零 */
    transport = "paused";
    playBtn.textContent = "▶";
    active().forEach(function (m) {
      cancelFade(m);
      m.audio.pause();
      m.audio.currentTime = 0;
      m.audio.volume = m.volume;
      m.lastBob = -1;
    });
    updateUI(0);
  }

  function safePlay(m, fade) {
    m.ready.then(function () {
      if (!m.on || transport !== "playing") return;
      if (fade) { cancelFade(m); m.audio.volume = 0; }   /* 先静音，等真的播起来再抬 */
      var p = m.audio.play();
      if (!p) return;
      var ok = function () {
        if (!fade) return;
        if (!m.on || transport !== "playing" || m.audio.paused) {
          m.audio.volume = m.volume;
          return;
        }
        startFade(m, m.volume, fade, null);
      };
      if (p.then) p.then(ok, function () { pauseTransport(); });
      else if (p.catch) p.catch(function () { pauseTransport(); });
    });
  }

  /* ---------- 音量缓入缓出 ----------
     新乐手直接在乐句中间插进来，音量从 0 抬起来才不刺耳；
     退场、暂停也不硬切，先淡出去再暂停。 */
  var JOIN_FADE = 0.5;      // 单人加入合奏
  var RESUME_FADE = 0.28;   // 暂停后继续
  var FADE_OUT = 0.3;       // 退场 / 暂停

  function startFade(m, to, dur, done) {
    m.fade = {
      from: m.audio.volume,
      to: to,
      t0: performance.now(),
      dur: Math.max(0.08, dur),
      done: done || null
    };
  }

  function cancelFade(m) { m.fade = null; }

  function fadeOut(m, done) {
    cancelFade(m);
    startFade(m, 0, FADE_OUT, function () {
      m.audio.pause();
      m.audio.volume = m.volume;
      if (done) done();
    });
  }

  /* 主循环里推进：smoothstep 曲线，两头软、中间快，比线性听着自然 */
  function tickFades(now) {
    for (var i = 0; i < MONSTERS.length; i++) {
      var m = MONSTERS[i], f = m.fade;
      if (!f) continue;
      var k = (now - f.t0) / (f.dur * 1000);
      if (k > 1) k = 1;
      var e = k * k * (3 - 2 * k);
      var v = f.from + (f.to - f.from) * e;
      m.audio.volume = v < 0 ? 0 : (v > 1 ? 1 : v);
      if (k >= 1) {
        m.fade = null;
        if (f.done) f.done();
      }
    }
  }

  /* ---------- 播放条状态（静音/播放控制的初始与切换态） ---------- */
  function refreshControls() {
    var a = active();
    seek.disabled = false;              // 进度条始终可拖，别再拦住用户
    if (!a.length) {
      transport = "idle";
      playBtn.textContent = "▶";
      hint.textContent = HINT_TEXT;
      hint.classList.remove("gone");
    } else {
      if (transport === "idle") transport = "paused";
      playBtn.textContent = (transport === "playing") ? "❚❚" : "▶";
    }
    durTime.textContent = duration ? fmt(duration) : "–:––";
    syncAllBtn();
  }

  /* ---------- 节拍网格 ----------
     律动完全交给 Spine 动画自身（Interact），不再叠加 CSS 位移/旋转。
     保留网格供以后新增乐手做同步用。 */
  function syncSway(m, pos) {
    var period = BEAT * m.bobBeats * 2;
    var ph = pos > FIRST_BEAT ? (pos - FIRST_BEAT) % period : 0;
    m.beatPhase = ph;   // 只记录相位，不改动 DOM
  }

  function bob(m) {
    m.lastBeatIdx = (m.lastBeatIdx || 0) + 1;   // 只记数，不改动 DOM
  }

  /* ---------- 进度条 ---------- */
  function updateUI(p) {
    seek.value = String(p);
    curTime.textContent = fmt(p);
  }

  function commitSeek() {
    var v = parseFloat(seek.value) || 0;
    if (duration && v > duration) v = duration;
    pendingPos = v;

    /* 先把滑块固定在目标位置；等音频真正跳过去之前，主循环不许回写 */
    updateUI(v);
    var a = active();
    if (!a.length) return;

    seekPending = true;
    Promise.all(a.map(function (m) {
      return m.ready.then(function () {
        try {
          m.audio.currentTime = v;
          m.lastBob = -1;
          if (transport === "playing") syncSway(m, v);
        } catch (e) {}
      });
    })).then(function () {
      seekPending = false;
      seekGuardUntil = performance.now() + 350;
    });
  }

  seek.addEventListener("pointerdown", function () { dragging = true; });

  /* 松手、取消、失焦、change 都可能是拖动终点，用 finishDrag 保证只提交一次 */
  function finishDrag() {
    if (!dragging) return;
    dragging = false;
    commitSeek();
  }
  window.addEventListener("pointerup", finishDrag);
  window.addEventListener("pointercancel", finishDrag);
  window.addEventListener("blur", finishDrag);
  seek.addEventListener("change", function () { if (dragging) finishDrag(); });

  seek.addEventListener("input", function () {
    curTime.textContent = fmt(parseFloat(seek.value) || 0);
    if (!dragging) commitSeek();   // 键盘方向键：立即生效
  });

  playBtn.addEventListener("click", function () {
    if (transport === "playing") { pauseTransport(); return; }
    if (!active().length) setMonster(MONSTERS[0], true);   // 没人上场时默认请吉他手开演
    startTransport();
  });

  /* ---------- 一键全员上下场 ---------- */
  var allBtn = document.getElementById("allBtn");

  function syncAllBtn() {
    if (!allBtn) return;
    var all = active().length === MONSTERS.length;
    allBtn.textContent = all ? "全部停演" : "全部开演";
    allBtn.classList.toggle("on", all);
  }

  if (allBtn) {
    allBtn.addEventListener("click", function () {
      if (active().length === MONSTERS.length) {
        MONSTERS.forEach(function (m) { if (m.on) setMonster(m, false); });
      } else {
        MONSTERS.forEach(function (m) { if (!m.on) setMonster(m, true); });
        /* 已经在演的时候别重复 startTransport，否则正在响的人也会被重新淡入一次 */
        if (transport !== "playing") startTransport();
      }
      syncAllBtn();
    });
    syncAllBtn();
  }

  /* ---------- 开场帷幕 ----------
     两块幕布按住往任意一边拖就分开，幅度跟着鼠标走；
     松手时超过 1/3 就自动开到底，否则弹回去。点一下也能直接拉开。 */
  (function () {
    var curtain = document.getElementById("curtain");
    if (!curtain) return;
    var L = curtain.querySelector(".half.left");
    var R = curtain.querySelector(".half.right");
    var tip = curtain.querySelector(".tip");
    var d = 0, dragging = false, x0 = 0, moved = 0, busy = false;

    function paint(v) {
      d = v < 0 ? 0 : (v > 1 ? 1 : v);
      L.style.transform = "translateX(" + (-d * 101) + "%)";
      R.style.transform = "translateX(" + (d * 101) + "%)";
      if (tip) tip.style.opacity = String(Math.max(0, 1 - d * 2.4));
    }

    function settle(to) {
      busy = true;
      var ease = "transform .95s cubic-bezier(.22,.86,.18,1)";
      L.style.transition = ease;
      R.style.transition = ease;
      paint(to);
      window.setTimeout(function () {
        if (to >= 1) curtain.classList.add("gone");   /* 开完就不挡点击了 */
        else busy = false;
      }, 980);
    }

    curtain.addEventListener("pointerdown", function (e) {
      if (busy) return;
      dragging = true;
      moved = 0;
      x0 = e.clientX;
      curtain.classList.add("dragging");
      L.style.transition = "none";
      R.style.transition = "none";
      try { curtain.setPointerCapture(e.pointerId); } catch (err) {}
    });

    curtain.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = e.clientX - x0;
      if (Math.abs(dx) > moved) moved = Math.abs(dx);
      paint(Math.abs(dx) / (window.innerWidth * 0.32));
    });

    function release() {
      if (!dragging) return;
      dragging = false;
      curtain.classList.remove("dragging");
      if (moved < 6) settle(1);          /* 没拖动 = 点了一下，直接开 */
      else settle(d > 0.32 ? 1 : 0);
    }
    curtain.addEventListener("pointerup", release);
    curtain.addEventListener("pointercancel", release);
  })();

  /* ---------- 主循环：进度、点头、乐队对表，全部读同一时钟 ---------- */
  function frame() {
    requestAnimationFrame(frame);
    tickFades(performance.now());
    if (transport !== "playing" || dragging) return;
    var a = active();
    if (!a.length) return;
    if (performance.now() < seekGuardUntil) return;
    if (seekPending || a[0].audio.seeking) return;   // 跳转未完成/浏览器正在定位

    /* 有些浏览器不触发 loadedmetadata，这里兜底读一次时长 */
    if (!duration) {
      var d = a[0].audio.duration;
      if (d && isFinite(d) && d > 0) {
        duration = d;
        seek.max = String(d);
        durTime.textContent = fmt(d);
      }
    }

    var pos = a[0].audio.currentTime;
    /* 时长未知时不回写滑块（max 还是默认 100，会把滑块钉在最右端） */
    if (duration) updateUI(Math.min(pos, duration));
    else curTime.textContent = fmt(pos);

    for (var i = 0; i < a.length; i++) {
      var m = a[i];
      if (pos < FIRST_BEAT) { m.lastBob = -1; continue; }
      var idx = Math.floor((pos - FIRST_BEAT) / (BEAT * m.bobBeats));
      if (idx !== m.lastBob) { m.lastBob = idx; bob(m); }
    }

    /* 多轨保险：约每 30s 对一次表，防音轨之间漂移 */
    if (++syncTick % 1800 === 0 && a.length > 1) {
      var lead = a[0].audio.currentTime;
      for (var j = 1; j < a.length; j++) {
        if (Math.abs(a[j].audio.currentTime - lead) > 0.05) a[j].audio.currentTime = lead;
      }
    }
  }

  refreshControls();
  requestAnimationFrame(frame);
})();
</script>


<script>
(function () {
  "use strict";

  var hintEl = document.getElementById("hint");

  function warn(msg) {
    hintEl.textContent = msg;
    hintEl.classList.remove("gone");
  }

  if (!window.PIXI || !PIXI.spine || !PIXI.spine.Spine) {
    warn("Spine 运行时没加载");
    return;
  }

  /* 舞台 SVG: viewBox 1600x900 + xMidYMax slice —— 角色共用这套坐标系 */
  var VB_W = 1600, VB_H = 900;
  var FOOT_Y = 700;
  var BPM = 147.28, BEAT = 60 / BPM, FIRST_BEAT = 0.316;
  var STRUM_BEATS = 2;

  function b64ToBytes(b64) {
    var raw = atob(b64), arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function audioPos() {
    var v = (typeof window.__angelAudioTime === "function") ? window.__angelAudioTime() : null;
    return (v === null || !isFinite(v)) ? null : v;
  }

  /* 吉他手：右手扫弦 + 四指依次拨动，跟音轨对时 */
  function guitarMotion(character, host) {
    var sk = character.skeleton;
    function bone(n) { return sk.findBone(n); }
    var b = {
      arm: bone("F_R_Arm"), forearm: bone("F_R_Forearm"), hand: bone("F_R_Hand"),
      lute: bone("C_Weapon3"),
      fingers: [bone("C_WeaponHand2"), bone("C_WeaponHand3"), bone("C_WeaponHand4"), bone("C_WeaponHand5")]
    };

    var originalApply = character.state.apply.bind(character.state);
    character.state.apply = function (skeleton) {
      originalApply(skeleton);
      if (!host.classList.contains("on")) return;

      var pos = audioPos();
      if (pos === null || pos <= 0) pos = performance.now() / 1000;

      var t = Math.max(0, pos - FIRST_BEAT);
      var cycle = STRUM_BEATS * BEAT;
      var phase = (t % cycle) / cycle;
      var down = Math.exp(-Math.pow((phase - 0.10) / 0.16, 2));
      var up   = Math.exp(-Math.pow((phase - 0.52) / 0.22, 2));
      var sweep = down - 0.55 * up;

      if (b.forearm) b.forearm.rotation += sweep * 11;
      if (b.hand)    b.hand.rotation    += sweep * 7;
      if (b.arm)     b.arm.rotation     += sweep * 2.2;
      if (b.lute)    b.lute.rotation    += sweep * 1.4;

      for (var i = 0; i < b.fingers.length; i++) {
        var f = b.fingers[i];
        if (!f) continue;
        var p = phase - i * 0.13;
        if (p < 0) p += 1;
        f.rotation += Math.exp(-Math.pow((p - 0.14) / 0.10, 2)) * 13;
      }
    };
  }

  /* 主唱：车身随节拍轻微呼吸 + 左右小幅摆动（不做整层上下位移） */
  function singerMotion(character, host) {
    var sk = character.skeleton;
    var trunk = sk.findBone("Bone") || sk.bones[1] || sk.bones[0];

    var originalApply = character.state.apply.bind(character.state);
    character.state.apply = function (skeleton) {
      originalApply(skeleton);
      if (!host.classList.contains("on") || !trunk) return;

      var pos = audioPos();
      if (pos === null || pos <= 0) pos = performance.now() / 1000;

      var t = Math.max(0, pos - FIRST_BEAT);
      var phase = (t % BEAT) / BEAT;                 // 每拍一次
      var pulse = Math.sin(phase * Math.PI);          // 0..1..0

      trunk.scaleX *= 1 + 0.012 * pulse;
      trunk.scaleY *= 1 - 0.008 * pulse;
      trunk.rotation += 0.7 * (pulse - 0.5);          // 轻微左右摆
    };
  }

  /* 从 atlas 文本里取出各区域的矩形（贴图集 984×984 上的位置） */
  function parseAtlasRegions(txt) {
    var out = {};
    var lines = String(txt).split(/\r?\n/);
    var cur = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line.trim()) { cur = null; continue; }
      if (/^\s/.test(line) && cur) {
        var kv = line.trim().split(":");
        if (kv.length >= 2) cur[kv[0].trim()] = kv[1].trim();
      } else if (line.indexOf(":") < 0) {
        cur = {};
        out[line.trim()] = cur;
      }
    }
    return out;
  }

  /* 悬浮乐器：从图集里抠出一块贴图，钉在嘴部骨骼上。
     她原本的设计就是身边浮着乐器，所以不让它进骨骼层级，
     而是每帧跟着嘴走，再按拍子做一点气息起伏。 */
  function addProp(character, prop, assets, baseTex, host) {
    var regions = parseAtlasRegions(assets.atlas);
    var r = regions[prop.region];
    if (!r) { warn("图集里找不到乐器区域：" + prop.region); return null; }

    var xy = r.xy.split(","), wh = r.size.split(",");
    var tex = new PIXI.Texture(baseTex, new PIXI.Rectangle(+xy[0], +xy[1], +wh[0], +wh[1]));
    var sp = new PIXI.Sprite(tex);
    sp.anchor.set(prop.anchor[0], prop.anchor[1]);

    var baseScale = prop.scale;
    var baseRot = prop.tilt * Math.PI / 180;
    sp.scale.set(baseScale);
    sp.rotation = baseRot;
    character.addChild(sp);

    var origUpdate = character.update.bind(character);
    character.update = function (dt) {
      origUpdate(dt);
      var mouth = character.skeleton.findBone(prop.bone || "F_Mouth_I");
      if (!mouth) return;

      /* 只有她在演的时候才送气；退场后号要完全静止，
         否则别人在演、音轨在走，这支号会一直抽动 */
      var puff = 0, wobble = 0;
      if (host.classList.contains("on")) {
        var pos = audioPos();
        var t = Math.max(0, (pos === null ? 0 : pos) - FIRST_BEAT);
        var phase = (t % BEAT) / BEAT;
        puff = Math.sin(phase * Math.PI);         // 每拍一次送气
        wobble = (puff - 0.5) * 0.022;
      }

      sp.position.set(mouth.worldX + prop.offset[0],
                      mouth.worldY + prop.offset[1] - puff * 1.8);
      sp.rotation = baseRot + wobble;
      sp.scale.set(baseScale * (1 + puff * 0.01));
    };
    return sp;
  }

  /* 贝斯手：两拍一个来回的轻摇，头随拍子点一下 */
  function bassMotion(character, host) {
    var sk = character.skeleton;
    var chest = sk.findBone("F_Chest_I");
    var head  = sk.findBone("F_Head_I");

    var originalApply = character.state.apply.bind(character.state);
    character.state.apply = function (skeleton) {
      originalApply(skeleton);
      if (!host.classList.contains("on")) return;

      var pos = audioPos();
      if (pos === null || pos <= 0) pos = performance.now() / 1000;

      var t = Math.max(0, pos - FIRST_BEAT);
      var cycle = BEAT * 2;
      var phase = (t % cycle) / cycle;
      var sway = Math.sin(phase * Math.PI * 2);

      if (chest) chest.rotation += sway * 0.9;
      if (head)  head.rotation  -= sway * 1.6;
    };
  }

  /* ===== 鼓手：鼓自己跳起来撞她，她躲不掉 =====
     四拍一个循环：待机 → 蓄力后缩 → 猛冲 → 命中 → 弹回去。
     鼓的落点每帧取她「当前」的头的位置，所以她往哪边躲，鼓就跟到哪。 */
  function ease(x) {
    x = x < 0 ? 0 : (x > 1 ? 1 : x);
    return x * x * (3 - 2 * x);
  }

  function drumSkit(t) {
    var cycle = BEAT * 4;
    var p = (t % cycle) / cycle;      // 0..1，四拍一循环
    var wind = 0, lunge = 0, squash = 0, shock = 0;

    /* 节拍对齐：p=0.75 正好是第 3 拍，鼓就砸在这一下 */
    if (p < 0.52) {
      /* 待机 */
    } else if (p < 0.68) {
      wind = ease((p - 0.52) / 0.16);
      squash = wind * 0.7;
    } else if (p < 0.75) {
      wind = 1;
      lunge = ease((p - 0.68) / 0.07);
      squash = 0.7;
    } else if (p < 0.86) {
      wind = 1; lunge = 1; squash = 1; shock = 1;
    } else {
      var k = (p - 0.86) / 0.14;
      wind = 1 - ease(k);
      lunge = 1 - ease(k);
      squash = 0.7 * (1 - k);
      shock = Math.max(0, 1 - k * 5);
    }
    return { p: p, wind: wind, lunge: lunge, squash: squash, shock: shock };
  }

  /* 她那一边的反应：想躲、被撞、尾巴乱甩 */
  function drummerMotion(character, host) {
    var sk = character.skeleton;
    var head = sk.findBone("F_Head");
    var body = sk.findBone("F_Body");
    var tail = sk.findBone("F_Tail");
    var face = sk.findSlot("F_Face1");
    var emo = sk.findSlot("F_EMO1");

    /* 先把可用的表情列出来（F_Face1..8 / F_EMO1..8 里实际存在的那几个） */
    var faces = [], emos = [];
    for (var i = 1; i <= 8; i++) {
      if (face && sk.getAttachment(face.data.index, "F_Face" + i)) faces.push("F_Face" + i);
      if (emo && sk.getAttachment(emo.data.index, "F_EMO" + i)) emos.push("F_EMO" + i);
    }

    var lastShock = 0;
    /* 当前被选中的表情。每帧都写回去一遍：
       万一动画里还留着表情时间线（或者别的动画被播放），也不会被冲掉。 */
    var chosenFace = null, chosenEmo = null;

    var originalApply = character.state.apply.bind(character.state);
    character.state.apply = function (skeleton) {
      originalApply(skeleton);

      /* 第一次先认动画给的那张脸作为基准，之后一直用我们挑的 */
      if (!chosenFace && face) chosenFace = face.getAttachment();
      if (!chosenEmo && emo) chosenEmo = emo.getAttachment();
      if (chosenFace && face.getAttachment() !== chosenFace) face.setAttachment(chosenFace);
      if (chosenEmo && emo.getAttachment() !== chosenEmo) emo.setAttachment(chosenEmo);

      if (!host.classList.contains("on")) { lastShock = 0; return; }

      var pos = audioPos();
      if (pos === null || pos <= 0) pos = performance.now() / 1000;
      var t = Math.max(0, pos - FIRST_BEAT);
      var k = drumSkit(t);

      /* 蓄力时她察觉到了，往反方向歪头想躲 */
      if (head) head.rotation += 6 * k.wind * (1 - k.lunge);
      /* 撞上的瞬间整个人往后一仰 */
      if (head) head.rotation -= 14 * k.shock;
      if (body) body.rotation += 3.2 * k.shock;
      if (tail) tail.rotation += 26 * k.shock;

      /* 每次撞到换一张随机表情（和上一张不重复，免得连续两次撞出同款） */
      if (k.shock > 0.9 && lastShock <= 0.9) {
        if (faces.length) {
          chosenFace = sk.getAttachment(face.data.index, pickOther(faces, chosenFace));
          face.setAttachment(chosenFace);
        }
        if (emos.length) {
          chosenEmo = sk.getAttachment(emo.data.index, pickOther(emos, chosenEmo));
          emo.setAttachment(chosenEmo);
        }
      }
      lastShock = k.shock;
    };
  }

  /* 从名字表里随机挑一个，尽量避开当前这张 */
  function pickOther(list, current) {
    var pool = list.filter(function (n) { return !current || current.name !== n; });
    if (!pool.length) pool = list;
    return pool[(Math.random() * pool.length) | 0];
  }

  /* 鼓本体：独立精灵，跟着头的当前位置飞 */
  function addDrum(character, cfg, assets, host) {
    var img = new Image();
    img.onload = function () {
      var bt = PIXI.BaseTexture.from(img);
      var sp = new PIXI.Sprite(new PIXI.Texture(bt));
      sp.anchor.set(0.5, 0.5);
      character.addChild(sp);

      var baseScale = cfg.scale || 0.72;
      var origUpdate = character.update.bind(character);

      character.update = function (dt) {
        origUpdate(dt);
        var sk = character.skeleton;
        var body = sk.findBone("F_Body");
        var head = sk.findBone("F_Head");
        if (!body || !head) return;

        var on = host.classList.contains("on");
        var k = { wind: 0, lunge: 0, squash: 0 };
        var bob = 0;

        if (on) {
          var pos = audioPos();
          if (pos === null || pos <= 0) pos = performance.now() / 1000;
          k = drumSkit(Math.max(0, pos - FIRST_BEAT));
          bob = Math.sin(performance.now() / 700) * 2.2;   // 待机时轻轻飘
        }

        /* 待机位：在她左边；蓄力时再往后缩一点 */
        var bx = body.worldX + cfg.base[0] - 34 * k.wind;
        var by = body.worldY + cfg.base[1] + bob + 10 * k.wind + 14 * k.squash;
        /* 落点：她「此刻」的头，所以躲不掉 */
        var tx = head.worldX + cfg.hitOffset[0];
        var ty = head.worldY + cfg.hitOffset[1];

        sp.position.set(bx + (tx - bx) * k.lunge, by + (ty - by) * k.lunge);
        sp.rotation = (cfg.tilt || 0) - 0.18 * k.lunge;
        /* 压缩感：横着挤、竖向拉 */
        sp.scale.set(baseScale * (1 + 0.14 * k.squash - 0.07 * k.lunge),
                     baseScale * (1 - 0.20 * k.squash + 0.10 * k.lunge));
      };
    };
    img.src = "data:image/png;base64," + assets.drum;
  }

  function createCharacter(cfg) {
    var host = document.getElementById(cfg.el);
    if (!host) return;
    var holder = host.querySelector(".bobber");
    var hit = host.querySelector(".hit");
    var assets = window[cfg.assets];
    if (!assets) { warn("角色资源缺失：" + cfg.assets); return; }

    var app = new PIXI.Application({
      resizeTo: host,
      backgroundAlpha: 0,
      antialias: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      autoDensity: true
    });
    holder.appendChild(app.view);

    var root = new PIXI.Container();
    app.stage.addChild(root);

    var character = null, baseW = 1, baseH = 1;

    function place() {
      var W = app.screen.width, H = app.screen.height;
      var sc = Math.max(W / VB_W, H / VB_H);
      var ox = (W - VB_W * sc) / 2;
      var oy = H - VB_H * sc;
      root.scale.set(sc);
      root.position.set(ox, oy);

      if (character) {
        character.scale.set(cfg.charH / baseH);
        /* 有些角色的 bounds 被远处附件撑大，可见部分不在 bounds 中心，
           用 shiftXRatio 把偏移补回来，保证可见车身落在 cfg.x */
        var shiftX = (cfg.shiftXRatio || 0) * cfg.charH;
        character.position.set(cfg.x + shiftX, FOOT_Y);
      }

      var visH = cfg.charH * cfg.visRatio;
      var visW = cfg.charH * baseW / baseH * cfg.visWFactor;
      hit.style.left = (ox + (cfg.x - visW / 2) * sc) + "px";
      hit.style.top = (oy + (FOOT_Y - visH) * sc) + "px";
      hit.style.width = (visW * sc) + "px";
      hit.style.height = (visH * sc) + "px";
    }
    place();
    app.renderer.on("resize", place);

    function syncOnOff() {
      if (!character) return;
      character.state.timeScale = host.classList.contains("on") ? 1 : 0;
    }
    new MutationObserver(syncOnOff).observe(host, { attributes: true, attributeFilter: ["class"] });

    var img = new Image();
    img.onload = function () {
      var baseTex = PIXI.BaseTexture.from(img);
      var atlas = new PIXI.spine.TextureAtlas(
        assets.atlas,
        function (pageName, done) { done(baseTex); },
        function (atlasObj) {
          try {
            var bin = new PIXI.spine.SkeletonBinary(new PIXI.spine.AtlasAttachmentLoader(atlasObj));
            var data = bin.readSkeletonData(b64ToBytes(assets.skel));

            /* 鼓手要按拍子随机换表情，动画里的表情时间线会把它覆盖掉，先摘掉。
               注意：pixi-spine 是压缩过的，类名被改了（Gt），
               不能用 constructor.name 判断，必须用导出的类引用。 */
            if (cfg.stripExpr) {
              var AT = PIXI.spine.AttachmentTimeline;
              data.animations.forEach(function (a) {
                a.timelines = a.timelines.filter(function (t) {
                  if (!(t instanceof AT)) return true;
                  var sl = data.slots[t.slotIndex];
                  return !(sl && /^(F_Face1|F_EMO1)$/.test(sl.name));
                });
              });
            }

            character = new PIXI.spine.Spine(data);
            root.addChild(character);

            var names = data.animations.map(function (a) { return a.name; });
            var pick = names.indexOf(cfg.anim) >= 0
              ? cfg.anim
              : (names.filter(function (n) { return n !== "Default"; })[0] || names[0]);

            /* 有的角色在 setup 姿态里还挂着远处的道具（乐器会挂在脚边），
               直接量包围盒会把它们算进去，导致缩放偏小、人物飘在半空。
               posedBounds 的角色先把动画应用上、清掉道具槽，再量。 */
            if (cfg.posedBounds) {
              var hide = new RegExp(cfg.hideSlots || "Instr");
              for (var si = 0; si < character.skeleton.slots.length; si++) {
                var sl = character.skeleton.slots[si];
                if (hide.test(sl.data.name)) sl.setAttachment(null);
              }
              character.state.setAnimation(0, pick, true);
              character.state.update(0);
              character.state.apply(character.skeleton);
              character.skeleton.updateWorldTransform();
            }

            var b = character.getLocalBounds();
            baseW = b.width || 1;
            baseH = b.height || 1;
            character.pivot.set(b.x + baseW / 2, b.y + baseH);
            place();

            character.state.setAnimation(0, pick, true);

            if (cfg.prop) addProp(character, cfg.prop, assets, baseTex, host);
            if (cfg.drum) addDrum(character, cfg.drum, assets, host);
            if (cfg.motion) cfg.motion(character, host);
            syncOnOff();
          } catch (e) {
            warn("骨骼解析失败：" + cfg.el + "：" + (e && e.message ? e.message : e));
            console.error(e);
          }
        }
      );
      if (!atlas.pages.length) warn("图集里没有贴图页：" + cfg.el);
    };
    img.onerror = function () { warn("角色贴图解码失败：" + cfg.el); };
    img.src = "data:image/png;base64," + assets.png;
  }

  /* 站位：四人一字排开，鼓手 428 / 主唱 668 / 吉他 954 / 贝斯 1237 */
